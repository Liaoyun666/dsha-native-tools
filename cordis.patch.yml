# dsha-native-tools 的 bundle 补丁：把 host row 插进 profile 的插件名册。
#
# 安装方式：`dsha-plugin install github:作者/dsha-native-tools`
# （或 `dsh plugin add <path-or-git-url>`），bundle 补丁会被自动应用，
# 所以**不要**再往 profile patch 里手写这一行 —— 重复 id 会让 loader 崩。
#
# 本插件没有浏览器半边（不带 dsh.client），工具直接出现在 host 的工具表里。
- insert:
    - id: dsha-native-tools
      name: 'dsha-native-tools'
